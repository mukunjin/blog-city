name: site-check

# The site is built by Cloudflare Pages, not by a GitHub workflow, so nothing
# here tells us when a deploy turns bad. This probe opens the live site daily
# and fails loudly if it stopped serving.
on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the site
        run: |
          set -euo pipefail
          url="https://blog-city.pages.dev/"
          code=$(curl -sS -o page.html -w "%{http_code}" -m 20 "$url")
          echo "HTTP $code from $url"
          test "$code" = "200"
          grep -q "博客之城" page.html
          echo "title ok"

      - name: Check the bundle it points at
        run: |
          set -euo pipefail
          asset=$(grep -o '/assets/[^"]*\.js' page.html | head -1)
          test -n "$asset"
          echo "asset: $asset"
          curl -fsS -o /dev/null -w "%{http_code} %{size_download} bytes\n" -m 30 "https://blog-city.pages.dev$asset"
