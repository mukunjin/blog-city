name: sync-health

# Daily, 01:43 UTC = 09:43 in Beijing. Deliberately not on the hour: GitHub's
# scheduler queues hardest at :00 of every hour (and worst around 00:00 UTC),
# where a run can start 20-30 minutes late or be dropped. :43 with an odd hour
# lands in a quiet slot; the job itself takes about a minute.
#
# Daily rather than weekly because a static build freezes whatever it saw: a
# weekly sync left the tower count up to seven days behind the list, which read
# as "the numbers are wrong".
on:
  schedule:
    - cron: "43 1 * * *"
  # Also run when this pipeline itself changes, so the first deploy already has
  # data and a fix gets exercised immediately. Data commits below do not match
  # these paths, so there is no loop.
  push:
    paths:
      - "scripts/sync-health.mjs"
      - ".github/workflows/sync-health.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-health
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pulls the csv mirror and the status api into data/, then rebuilds the
      # committed snapshot. Both steps are offline-safe: if the network is down
      # the run fails here and the committed files stay untouched.
      - name: Pull the csv and the status api
        run: node scripts/sync-health.mjs

      - name: Rebuild the city data
        run: node scripts/build-blogs.mjs

      - name: Commit the snapshot
        id: commit
        run: |
          # Both files are byte-stable when nothing changed: build-blogs keeps
          # the old generatedAt when the payload is identical. So an empty
          # porcelain here means "no new facts", and committing would only
          # trigger a pointless rebuild.
          if [ -z "$(git status --porcelain data/blogs-original.csv data/health.json src/data/blogs.json)" ]; then
            echo "no new data — skipping commit"
            exit 0
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          git config user.name "blog-city-bot"
          git config user.email "blog-city-bot@users.noreply.github.com"
          git add data/blogs-original.csv data/health.json src/data/blogs.json
          git commit -m "chore(data): sync blog health"
          git push

      # Push already triggers Cloudflare Pages by webhook. This is a belt-and-
      # braces trigger in case a delivery gets dropped; skipped when the secret
      # is not configured.
      - name: Trigger the Pages build
        if: steps.commit.outputs.pushed == 'true' && env.CF_DEPLOY_HOOK != ''
        env:
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$CF_DEPLOY_HOOK" > /dev/null
