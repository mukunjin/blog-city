name: deploy

# Every push to master (including the weekly data commit) rebuilds and
# publishes. Data is baked into the build, so nothing is fetched at runtime.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Freshness is baked into blogs.json at build time, so a change to the
      # metric (shared/blogs.mjs) would otherwise deploy unchanged data. Rebuild
      # it here from the committed snapshot; if the mirrors are unreachable,
      # fall back to the snapshot that is already in the repo.
      - name: Rebuild the city data
        run: node scripts/build-blogs.mjs --remote || echo "::warning::upstream unreachable, using the committed snapshot"

      - run: npm run build

      # Skips quietly until the two repository secrets exist, so the workflow
      # is safe to commit before the Cloudflare account is wired up.
      - name: Publish to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
